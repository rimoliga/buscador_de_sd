name: Update dataset

on:
  schedule:
    - cron: '0 6 * * 1'  # Lunes 06:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ENACOM CA certificate
        run: |
          true | openssl s_client -connect hertz.enacom.gob.ar:443 -showcerts 2>/dev/null | \
            sed -n '/BEGIN CERTIFICATE/,/END CERTIFICATE/p' | \
            sudo tee /usr/local/share/ca-certificates/enacom.crt > /dev/null
          sudo update-ca-certificates

      - name: Download and process dataset
        run: |
          python -m data.procesar_archivo_enacom \
            --scrape \
            --excel-output /tmp/listado_enacom.xlsx

      - name: Bump dataset version
        run: |
          python -m data.bump_version --dataset-version $(date +%Y.%m.%d)

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            data/listado_radioaficionados_unificado.json.gz \
            data/dataset_metadata.json \
            data/listado_radioaficionados_stats.json \
            data/version.json \
            modules/config.js
          git diff --staged --quiet && echo "Dataset sin cambios, nada que commitear." && exit 0
          git commit -m "chore: update dataset $(date +%Y-%m-%d)"
          git push
